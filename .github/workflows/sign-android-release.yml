name: Sign Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies and build web assets
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Sync committed Android project
        run: npx cap sync android

      - name: Decode private signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          keystore_path="$RUNNER_TEMP/signing/release.jks"

          # GitHub secrets may contain copied line breaks or spaces. Remove
          # whitespace only; reject every other non-Base64 character.
          encoded="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$encoded" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty after trimming whitespace."
            exit 1
          fi
          if [[ ! "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains characters outside the Base64 alphabet."
            exit 1
          fi
          if (( ${#encoded} % 4 != 0 )); then
            echo "::error::ANDROID_KEYSTORE_BASE64 has an invalid Base64 length (must be a multiple of 4). Recreate it from the original .jks file."
            exit 1
          fi

          if ! printf '%s' "$encoded" | base64 --decode > "$keystore_path" 2>/dev/null; then
            rm -f "$keystore_path"
            echo "::error::ANDROID_KEYSTORE_BASE64 is malformed. Recreate the secret from the original .jks file; the secret value was not logged."
            exit 1
          fi
          if [ ! -s "$keystore_path" ]; then
            rm -f "$keystore_path"
            echo "::error::Decoded keystore is empty. Verify the Base64 secret was created from the original .jks file."
            exit 1
          fi

          echo "Keystore Base64 decoded successfully (value not logged)."
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed APK and Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon clean assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab | tee signed-release-sha256.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: so-hui-thong-minh-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/signed-release-sha256.txt
          if-no-files-found: error
          retention-days: 90
