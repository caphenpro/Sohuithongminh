name: Build F-Droid-compatible Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/build-fdroid-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Upload generated npm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Run tests and build web assets
        run: |
          npm test
          npm run build

      - name: Generate and sync native Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set release version metadata
        working-directory: android
        run: |
          sed -i 's/versionCode 1/versionCode 20000/' app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.0"/' app/build.gradle
          grep -nE 'applicationId|versionCode|versionName|minSdkVersion|targetSdkVersion' app/build.gradle

      - name: Commit generated Android project to repository
        run: |
          # Keep generated native sources and bundled web assets in version control.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/.gitignore")
          excluded = {
              "capacitor-cordova-android-plugins",
              "app/src/main/assets/public",
              "app/src/main/assets/capacitor.config.json",
              "app/src/main/assets/capacitor.plugins.json",
              "app/src/main/res/xml/config.xml",
          }
          lines = path.read_text().splitlines()
          path.write_text("\\n".join(line for line in lines if line.strip() not in excluded) + "\\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android
          if ! git diff --cached --quiet; then
            git commit -m 'chore(android): commit generated native project [skip ci]'
            git push
          fi

      - name: Build unsigned release APK for F-Droid source-build verification
        working-directory: android
        run: ./gradlew --no-daemon --no-build-cache clean assembleRelease

      - name: Build debug APK for direct device testing
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Package generated Android source project
        run: |
          zip -r android-source-project.zip android -x '*/build/*' '*/.gradle/*' 'android/local.properties'
          test -s android-source-project.zip

      - name: Upload generated Android source project
        uses: actions/upload-artifact@v4
        with:
          name: so-hui-thong-minh-android-source
          path: android-source-project.zip
          if-no-files-found: error
          retention-days: 90

      - name: Verify APK outputs and checksums
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload F-Droid source-build APK
        uses: actions/upload-artifact@v4
        with:
          name: so-hui-thong-minh-fdroid-unsigned-release
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: so-hui-thong-minh-debug-installable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
